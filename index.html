<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beranda · King Sang Long</title>
<link rel="stylesheet" href="assets/style.css?v=1794710626">
</head>
<body data-page="index" data-area="publik">
<div id="stage"><div id="app"><main id="view"></main></div></div>
<script src="assets/app.js?v=1794710626"></script>
<script>
const {TOURS,icon,pill,curRound,av,orgName,CLUBS}=KSL;
let q="";
KSL.page(()=>{
  // every tournament opens inside the app: running/archive -> summary, upcoming -> info & sign-up
  const href=t=>t.classes?"turnamen.html?t="+t.id:"segera.html?t="+t.id;
  const row=t=>`<a href="${href(t)}">
    <div class="grow"><b>${t.name}</b>
      <div class="meta mt2"><span>${icon("cal")}${t.date}</span><span>${icon("pin")}${t.place}</span><span>${icon("list")}${t.sys}</span><span>${icon("org")}${orgName(t)}</span></div></div>
    ${t.start&&KSL.until(t.start)?`<span class="chip-cd">${KSL.until(t.start).d} hari lagi</span>`:pill(t.status)}${icon("right")}</a>`;
  const m=t=>!q||(t.name+" "+t.place+" "+orgName(t)).toLowerCase().includes(q);
  const live=TOURS.filter(t=>t.status==="live"&&m(t)),soon=TOURS.filter(t=>t.status==="soon"&&m(t)),done=TOURS.filter(t=>t.status==="done"&&m(t));
  const empty=x=>x.length?"":'<div class="pad sm mute">Tidak ada yang cocok.</div>';
  const card=t=>`<a class="card feat mb" href="${href(t)}" style="display:block">
    <div class="row between nowrap"><span class="pill live">Berlangsung</span><span class="sm mute">${orgName(t)}</span></div>
    <h2 class="mt">${t.name}</h2>
    <div class="meta mt2"><span>${icon("cal")}${t.date}</span><span>${icon("pin")}${t.place}</span></div>
    <div class="grid ${t.classes.length>1?"g2e keep2":""} mt">${t.classes.map(c=>{const n=c.rounds.length;return `<div class="fc"><div class="row between nowrap"><b>${c.name}</b><span class="sm">Babak ${curRound(c)}/${n}</span></div><div class="bar mt2"><i style="width:${KSL.doneRounds(c)/n*100}%"></i></div></div>`}).join("")}</div>
    <div class="row between mt"><span class="sm">Pairing, klasemen, peserta</span>${icon("right")}</div>
  </a>`;
  // top club ratings across all tournaments (one row per player ID)
  const top=KSL.PLAYERS.map(p=>({...p,r:KSL.ratingNow(p.pid)})).sort((a,b)=>b.r-a.r).slice(0,5);
  return `
  <div class="card banner mb">
    <div class="bn-text">
      <h1>Turnamen Catur</h1>
      <div class="mute mt2">Pilih turnamen untuk melihat pairing, hasil, dan klasemen.</div>
      <div class="bn-bar">
        <div class="input-ic">${icon("search")}<input id="q" placeholder="Cari turnamen, tempat, atau klub" value="${q}"></div>
        <a class="btn acc" href="${KSL.loggedIn()?"panel-buat.html":"daftar.html"}">${icon("plus")}Buat Turnamen</a>
      </div>
    </div>
    <div class="board-art dsk" aria-hidden="true">${Array.from({length:64},(_,i)=>`<i class="${(Math.floor(i/8)+i)%2?"d":""}"></i>`).join("")}<img src="assets/ksl-logo.png" alt="Logo King Sang Long"></div>
  </div>
  <div class="grid g2">
    <div>
      <h3>Sedang Berlangsung (${live.length})</h3>
      ${live.map(card).join("")||'<div class="card mb">'+empty(live)+'</div>'}
      <h3>Akan Datang</h3>
      <div class="card list mb">${soon.map(row).join("")}${empty(soon)}</div>
      <h3>Arsip</h3>
      <div class="card list">${done.map(row).join("")}${empty(done)}</div>
    </div>
    <aside class="side-col">
      <h3>Klub & Komunitas</h3>
      <div class="card list mb">${CLUBS.slice(0,4).map(c=>`<a href="cari.html?klub=${c.id}">${av(c.name)}<div class="grow"><b class="sm">${c.name}</b><div class="sm mute">${c.city}</div></div>${icon("right")}</a>`).join("")}<a href="cari.html" class="sm lnk" style="justify-content:center">Lihat semua klub & pemain</a></div>
      <h3>Rating Klub Tertinggi${KSL.tip("Rating klub (Elo) terkini dari semua turnamen di aplikasi ini. Bukan rating resmi FIDE/PERCASI.","Rating klub")}</h3>
      <div class="card list">${top.map((p,i)=>`<a href="pemain.html?pid=${p.pid}"><span class="rank ${i<3?"r"+(i+1):""}">${i+1}</span><div class="grow"><b>${p.name}</b><div class="pid">${p.pid} · ${KSL.clubName(p.club)}</div></div><b>${p.r}</b></a>`).join("")}</div>
    </aside>
  </div>`;
});
document.addEventListener("input",e=>{if(e.target.id!=="q")return;q=e.target.value.trim().toLowerCase();const pos=e.target.selectionStart;KSL.render();const f=document.getElementById("q");f.focus();f.setSelectionRange(pos,pos)});
</script>
</body>
</html>
