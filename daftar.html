<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar Klub · King Sang Long</title>
<link rel="stylesheet" href="assets/style.css?v=1794710626">
</head>
<body data-page="daftar" data-area="publik">
<div id="stage"><div id="app"><main id="view"></main></div></div>
<script src="assets/app.js?v=1794710626"></script>
<script>
const {icon,CLUBS}=KSL;
const G='<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09a6.97 6.97 0 0 1 0-4.18V7.07H2.18A11 11 0 0 0 1 12c0 1.77.42 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>';
let done=null,googleAcc=null;
// one short form: club + contact (email or phone) + password (or Google sign-in + club name & city)
KSL.page(()=>done?`
  <div class="card pad" style="max-width:440px;margin:24px auto;text-align:center">
    <span class="av lg" style="background:var(--ok-soft);color:var(--ok)">${icon("check","lg")}</span>
    <h1 class="mt">${done} terdaftar</h1>
    <div class="sm mute mt2">Kamu sudah bisa membuat turnamen. Turnamen pertama tampil di beranda setelah ditinjau admin.</div>
    <a class="btn mt" href="panel-buat.html">${icon("plus")}Buat Turnamen</a>
  </div>`:googleAcc?`
  <div class="card" style="max-width:440px;margin:16px auto">
    <div class="pad">
      <h1>Lengkapi Data Klub</h1>
      <div class="row nowrap mt2"><span class="pill ok">Google terhubung · ${googleAcc}</span><a href="#" class="lnk sm" data-act="unGoogle">Ganti</a></div>
    </div>
    <form class="pad bt" id="f">
      <div class="field"><label>Nama klub / komunitas</label><input name="club" required placeholder="Komunitas Catur Galis" autofocus></div>
      <div class="field"><label>Kota</label><input name="city" required placeholder="Pamekasan"></div>
      <button class="btn acc block" type="submit">${icon("check")}Selesai & Daftar Klub</button>
    </form>
  </div>`:`
  <div class="card" style="max-width:440px;margin:16px auto">
    <div class="pad">
      <h1>Daftar Klub / Komunitas</h1>
      <button type="button" class="btn alt block mt" data-act="google">${G}Daftar dengan Google</button>
      <div class="row nowrap mt" style="gap:10px"><hr style="flex:1;border:0;border-top:1px solid var(--line)"><span class="sm mute">atau isi formulir</span><hr style="flex:1;border:0;border-top:1px solid var(--line)"></div>
    </div>
    <form class="pad bt" id="f">
      <div class="field"><label>Nama klub / komunitas</label><input name="club" required placeholder="Komunitas Catur Galis"></div>
      <div class="field"><label>Kota</label><input name="city" required placeholder="Pamekasan"></div>
      <div class="field"><label>Email atau nomor WhatsApp</label><input name="id" required placeholder="nama@email.com / 08xx"></div>
      <div class="field"><label>Kata sandi</label><input name="pw" type="password" required minlength="8" placeholder="Minimal 8 karakter"></div>
      <button class="btn block" type="submit">Daftar</button>
      <div class="sm mute mt" style="text-align:center">Dengan mendaftar kamu menyetujui Syarat & Ketentuan dan Kebijakan Privasi.</div>
    </form>
    <div class="pad bt sm mute" style="text-align:center">Sudah punya akun? <a class="lnk" href="masuk.html">Masuk</a></div>
  </div>`,{google:()=>{googleAcc="pengurus@gmail.com";KSL.toast("Akun Google terhubung, isi nama klub")},unGoogle:()=>{googleAcc=null}});
document.addEventListener("submit",e=>{e.preventDefault();const f=new FormData(e.target),name=f.get("club").trim();
  if(CLUBS.some(c=>c.name.toLowerCase()===name.toLowerCase())){KSL.toast("Nama klub sudah terdaftar. Masuk dengan akun klub itu, atau pakai nama lain.","x",3200);return}
  done=name;KSL.setAuth("ksl");KSL.render();KSL.toast("Akun klub dibuat")});
</script>
</body>
</html>
